<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0" stop-color="#171c42"/><stop offset=".55" stop-color="#0b0f2c"/><stop offset="1" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity=".28"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fdf6e6"/><stop offset=".3" stop-color="#f0dcb0"/>
      <stop offset=".6" stop-color="#d9b473"/><stop offset=".85" stop-color="#9a7440"/><stop offset="1" stop-color="#6b4e2a"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98c4e" stop-opacity="0"/><stop offset=".5" stop-color="#a97c42" stop-opacity=".5"/><stop offset="1" stop-color="#b98c4e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#e2b96a"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <clipPath id="frontHalf"><rect x="-260" y="0" width="520" height="160"/></clipPath>
    <clipPath id="planetClip"><circle cx="0" cy="0" r="118"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="180" fill="url(#neb1)"/>
  <circle cx="400" cy="410" r="190" fill="url(#neb2)"/>
  <g fill="#e8ecf7">
    <circle cx="80" cy="84" r="3" opacity=".9"/><circle cx="436" cy="72" r="2.4" opacity=".7"/>
    <circle cx="468" cy="190" r="2" opacity=".55"/><circle cx="52" cy="310" r="2.2" opacity=".6"/>
    <circle cx="120" cy="440" r="2.8" opacity=".8"/><circle cx="330" cy="48" r="1.8" opacity=".5"/>
    <circle cx="454" cy="342" r="1.8" opacity=".5"/><circle cx="206" cy="60" r="1.6" opacity=".45"/>
    <circle cx="44" cy="176" r="1.7" opacity=".5"/><circle cx="390" cy="126" r="1.5" opacity=".4"/>
    <path d="M96 372l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#e2b96a" opacity=".9"/>
  </g>
  <g transform="translate(256 262) rotate(-18)">
    <!-- back of rings -->
    <g fill="none" opacity=".95">
      <ellipse rx="206" ry="64" stroke="url(#ring1)" stroke-width="16" opacity=".9"/>
      <ellipse rx="172" ry="52" stroke="#c9b4ff" stroke-width="6" opacity=".55"/>
    </g>
    <!-- planet -->
    <circle r="118" fill="url(#planet)"/>
    <g clip-path="url(#planetClip)">
      <rect x="-120" y="-46" width="240" height="26" fill="url(#band)" transform="rotate(4)"/>
      <rect x="-120" y="6" width="240" height="20" fill="url(#band)" transform="rotate(4)"/>
      <rect x="-120" y="52" width="240" height="16" fill="url(#band)" transform="rotate(4)"/>
      <ellipse cx="-38" cy="-40" rx="70" ry="46" fill="#ffffff" opacity=".14"/>
    </g>
    <!-- front of rings over the planet -->
    <g fill="none" clip-path="url(#frontHalf)">
      <ellipse rx="206" ry="64" stroke="url(#ring1)" stroke-width="16"/>
      <ellipse rx="172" ry="52" stroke="#e6d9ff" stroke-width="6" opacity=".75"/>
    </g>
    <circle cx="196" cy="-26" r="7" fill="#e2b96a"/>
  </g>
</svg>
